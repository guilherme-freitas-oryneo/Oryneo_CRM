name: QA isolated automations (no live dispatch)

on:
  pull_request:
    paths:
      - 'src/automation/**'
      - 'supabase/automation/**'
      - '.github/workflows/qa-automations-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Automation TypeScript & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript + entire CRM build
        run: npm run build
      - name: Automation contract and regression tests
        run: npm test -- --run src/automation

  database:
    name: Disposable PostgreSQL 17 RLS/contract tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Emulate Supabase restricted roles and auth claims
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS
          $function$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $function$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          SQL
      - name: Validate additive schema in disposable database only
        run: psql -v ON_ERROR_STOP=1 -f supabase/automation/schema.preview.sql
      - name: Verify denied writes, tenant isolation, and immutable published versions
        run: psql -v ON_ERROR_STOP=1 -f supabase/automation/schema.qa.sql
