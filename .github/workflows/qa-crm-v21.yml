name: Homologar interface CRM v2.1
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'contratar/**'
      - 'public/**'
      - '.github/scripts/qa-crm-v21.mjs'
      - '.github/scripts/qa-login-brand.mjs'
      - '.github/scripts/qa-direct-checkout.mjs'
      - '.github/scripts/qa-pix-generated.mjs'
      - '.github/scripts/qa-whatsapp-ai-queue.sql'
      - '.github/scripts/qa-whatsapp-sdr-toggle.sql'
      - '.github/workflows/qa-crm-v21.yml'
      - 'supabase/migrations/20261028213000_crm_whatsapp_ai_durable_queue.sql'
      - 'supabase/migrations/20261029030000_crm_whatsapp_sdr_conversation_toggle.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  whatsapp-ai-queue-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validar fila durável do SDR em PostgreSQL descartável
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f .github/scripts/qa-whatsapp-ai-queue.sql
      - name: Validar controle do SDR por conversa
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c 'drop schema public cascade; create schema public;'
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f .github/scripts/qa-whatsapp-sdr-toggle.sql
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Dependencias e compilacao
        run: |
          npm ci
          npm run build -- --base=/Oryneo_CRM/
          npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium webkit
      - name: Iniciar preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --base=/Oryneo_CRM/ > /tmp/oryneo-qa-v21.log 2>&1 &
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/Oryneo_CRM/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/oryneo-qa-v21.log
          exit 1
      - name: Executar testes funcionais sem acesso ao Supabase
        run: |
          node .github/scripts/qa-login-brand.mjs
          node .github/scripts/qa-direct-checkout.mjs
          node .github/scripts/qa-pix-generated.mjs
          node .github/scripts/qa-crm-v21.mjs
          node .github/scripts/qa-playbook.mjs
      - name: Publicar capturas de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oryneo-crm-v21-qa
          path: qa-results/*.png
          if-no-files-found: ignore
