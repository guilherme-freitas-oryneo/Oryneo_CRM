name: ORYNEO — Navegador real do CRM publicado (sem downloads de browser)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quick-live-browser-smoke.yml'
      - 'qa/live-browser-native.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-public:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar Chrome e ChromeDriver pré-instalados
        shell: bash
        run: |
          set -euo pipefail
          which google-chrome
          which chromedriver
          google-chrome --version
          chromedriver --version
      - name: Validar login em produção (390 e 1440 px) sem efeitos externos
        run: node qa/live-browser-native.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oryneo-live-browser-390-1440
          path: qa-live-browser/
          if-no-files-found: ignore
