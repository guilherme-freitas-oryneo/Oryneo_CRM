name: QA Automações — PostgreSQL descartável

on:
  pull_request:
    paths:
      - 'supabase/automation/**'
      - '.github/workflows/qa-oryneo-automations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Criar apenas papéis e auth.uid simulados (DB descartável)
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.uid()
          RETURNS uuid LANGUAGE sql STABLE
          AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          SQL
      - name: Aplicar somente o esquema proposto em PostgreSQL temporário
        run: psql -v ON_ERROR_STOP=1 -f supabase/automation/schema.preview.sql
      - name: Testar RLS, isolamento, deduplicação e imutabilidade
        run: psql -v ON_ERROR_STOP=1 -f supabase/automation/schema.qa.sql
      - name: Aplicar funções de rascunho exclusivamente no Postgres temporário
        run: psql -v ON_ERROR_STOP=1 -f supabase/automation/draft_api.preview.sql
      - name: Verificar transações, permissões, revisão otimista e trilha de auditoria
        run: psql -v ON_ERROR_STOP=1 -f supabase/automation/draft_api.qa.sql
      - name: Preparar publicação versionada, sem ativar o runtime (banco descartável)
        run: psql -v ON_ERROR_STOP=1 -f supabase/automation/publication.preview.sql
      - name: Verificar publicação imutável, CAS, papéis e estado desativado
        run: psql -v ON_ERROR_STOP=1 -f supabase/automation/publication.qa.sql
      - name: Preparar inbox com leases apenas no banco descartável
        run: psql -v ON_ERROR_STOP=1 -f supabase/automation/shadow_queue.preview.sql
      - name: Testar deduplicação, fencing, recuperação e efeitos bloqueados
        run: psql -v ON_ERROR_STOP=1 -f supabase/automation/shadow_queue.qa.sql
